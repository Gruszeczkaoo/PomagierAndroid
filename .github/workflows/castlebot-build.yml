name: CastleBot Android APK
on:
  push:
    branches: [castlebot-v0.2]
    paths:
      - "CastleBot/**"
      - ".github/workflows/castlebot-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: CastleBot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CastleBot_by_Don_v0.3.1_debug_APK
          path: CastleBot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
