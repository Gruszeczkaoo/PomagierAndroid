name: Build Pomagier Android APK v1.0.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'PomagierAndroid_v1.0.1_SESSION_FIX_AndroidStudio.zip'
      - '.github/workflows/build-apk-v1.0.1.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q PomagierAndroid_v1.0.1_SESSION_FIX_AndroidStudio.zip -d extracted
          test -f extracted/PomagierAndroid_v1.0.1/settings.gradle.kts

      - name: Build signed release APK
        working-directory: extracted/PomagierAndroid_v1.0.1
        run: gradle --no-daemon clean assembleRelease

      - name: Prepare APK artifact
        run: |
          cp extracted/PomagierAndroid_v1.0.1/app/build/outputs/apk/release/app-release.apk Pomagier-by-Don-v1.0.1.apk
          sha256sum Pomagier-by-Don-v1.0.1.apk > Pomagier-by-Don-v1.0.1.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pomagier-by-Don-v1.0.1
          if-no-files-found: error
          path: |
            Pomagier-by-Don-v1.0.1.apk
            Pomagier-by-Don-v1.0.1.apk.sha256
