name: Build Pomagier Android APK v1.0.6

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q "PomagierAndroid_v1.0.6_ALCOHOL_AUTO_MENEL_FIX.zip" -d extracted

      - name: Build signed release APK
        run: |
          cd "extracted/PomagierAndroid_v1.0.6_ALCOHOL_AUTO_MENEL_FIX"
          gradle --no-daemon clean assembleRelease

      - name: Prepare APK
        run: |
          cp "extracted/PomagierAndroid_v1.0.6_ALCOHOL_AUTO_MENEL_FIX/app/build/outputs/apk/release/app-release.apk" "Pomagier-by-Don-v1.0.6.apk"
          sha256sum "Pomagier-by-Don-v1.0.6.apk" > "Pomagier-by-Don-v1.0.6.apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pomagier-by-Don-v1.0.6
          if-no-files-found: error
          path: |
            Pomagier-by-Don-v1.0.6.apk
            Pomagier-by-Don-v1.0.6.apk.sha256
