name: Build Pomagier Android APK

"on":
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: pomagier-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Resolve project source
        shell: bash
        run: |
          set -euo pipefail

          # Obsługuje oba sposoby pracy:
          # 1) pełny projekt Android w repo,
          # 2) paczka PomagierAndroid_v*.zip w katalogu głównym.
          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            echo "Buduję projekt bezpośrednio z repo."
          else
            rm -rf extracted
            mkdir extracted

            ZIP_FILE="$(
              find . -maxdepth 1 -type f -name 'PomagierAndroid_v*.zip' -printf '%f\n' \
                | sort -V \
                | tail -n 1
            )"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Nie znaleziono projektu Android ani PomagierAndroid_v*.zip."
              ls -la
              exit 1
            fi

            echo "Używam najnowszej paczki: $ZIP_FILE"
            unzip -tq "$ZIP_FILE"
            unzip -q "$ZIP_FILE" -d extracted

            PROJECT_DIR="$(
              find extracted -mindepth 1 -maxdepth 3 -type f -name 'settings.gradle.kts' -printf '%h\n' \
                | head -n 1
            )"

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Nie znaleziono projektu Android po rozpakowaniu."
              find extracted -maxdepth 4 -type f -print | head -n 100
              exit 1
            fi
          fi

          # Kolejne nakładki na najnowszą bazową paczkę projektu.
          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1022.py" ]; then
            echo "Nakładam aktualizację v1.0.22..."
            python "$GITHUB_WORKSPACE/tools/patch_v1022.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1023.py" ]; then
            echo "Nakładam aktualizację v1.0.23..."
            python "$GITHUB_WORKSPACE/tools/patch_v1023.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1024.py" ]; then
            echo "Nakładam aktualizację v1.0.24..."
            python "$GITHUB_WORKSPACE/tools/patch_v1024.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1025.py" ]; then
            echo "Nakładam aktualizację v1.0.25..."
            python "$GITHUB_WORKSPACE/tools/patch_v1025.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1026.py" ]; then
            echo "Nakładam aktualizację v1.0.26..."
            python "$GITHUB_WORKSPACE/tools/patch_v1026.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1027.py" ]; then
            echo "Nakładam aktualizację v1.0.27..."
            python "$GITHUB_WORKSPACE/tools/patch_v1027.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1028.py" ]; then
            echo "Nakładam aktualizację v1.0.28..."
            python "$GITHUB_WORKSPACE/tools/patch_v1028.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1029.py" ]; then
            echo "Nakładam aktualizację v1.0.29..."
            python "$GITHUB_WORKSPACE/tools/patch_v1029.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1030.py" ]; then
            echo "Nakładam aktualizację v1.0.30..."
            python "$GITHUB_WORKSPACE/tools/patch_v1030.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1031.py" ]; then
            echo "Nakładam aktualizację v1.0.31..."
            python "$GITHUB_WORKSPACE/tools/patch_v1031.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1032.py" ]; then
            echo "Nakładam aktualizację v1.0.32..."
            python "$GITHUB_WORKSPACE/tools/patch_v1032.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1033.py" ]; then
            echo "Nakładam aktualizację v1.0.33..."
            python "$GITHUB_WORKSPACE/tools/patch_v1033.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1034.py" ]; then
            echo "Nakładam aktualizację v1.0.34..."
            python "$GITHUB_WORKSPACE/tools/patch_v1034.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1035.py" ]; then
            echo "Nakładam aktualizację v1.0.35..."
            python "$GITHUB_WORKSPACE/tools/patch_v1035.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1036.py" ]; then
            echo "Nakładam aktualizację v1.0.36..."
            python "$GITHUB_WORKSPACE/tools/patch_v1036.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1037.py" ]; then
            echo "Nakładam aktualizację v1.0.37..."
            python "$GITHUB_WORKSPACE/tools/patch_v1037.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1038.py" ]; then
            echo "Nakładam aktualizację v1.0.38..."
            python "$GITHUB_WORKSPACE/tools/patch_v1038.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1039.py" ]; then
            echo "Nakładam aktualizację v1.0.39..."
            python "$GITHUB_WORKSPACE/tools/patch_v1039.py" "$PROJECT_DIR"
          fi

          if [ -f "$GITHUB_WORKSPACE/tools/patch_v1040.py" ]; then
            echo "Nakładam aktualizację v1.0.40..."
            python "$GITHUB_WORKSPACE/tools/patch_v1040.py" "$PROJECT_DIR"
          fi

          VERSION="$(
            sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
              "$PROJECT_DIR/app/build.gradle.kts" | head -n 1
          )"
          [ -n "$VERSION" ] || VERSION="unknown"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "POMAGIER_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Projekt: $PROJECT_DIR"
          echo "Wersja: $VERSION"

      - name: Validate sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          node --check app/src/main/assets/pomagier.user.js
          python -m py_compile app/src/main/python/brain.py app/src/main/python/brain_android.py
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for p in pathlib.Path("app/src/main").rglob("*.xml"):
              ET.parse(p)
          print("XML OK")
          PY

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleRelease

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          OUT="Pomagier-by-Don-v${POMAGIER_VERSION}.apk"
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Publish APK to repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$APK_FILE" "dist/$APK_FILE"
          cp "$APK_FILE.sha256" "dist/$APK_FILE.sha256"

          git config user.name "Pomagier Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/$APK_FILE" "dist/$APK_FILE.sha256"

          if git diff --cached --quiet; then
            echo "APK already published."
          else
            git commit -m "Publish Pomagier v${POMAGIER_VERSION} APK [skip ci]"
            git push
          fi

      - name: One-time cleanup of old workflow files
        shell: bash
        continue-on-error: true
        run: |
          set -u
          KEEP=".github/workflows/build-apk.yml"
          mkdir -p .github/workflows

          mapfile -t OLD < <(
            find .github/workflows -maxdepth 1 -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              ! -path "$KEEP" -print
          )

          if [ "${#OLD[@]}" -eq 0 ]; then
            echo "Brak starych workflowów do usunięcia."
            exit 0
          fi

          echo "Usuwam stare workflowy:"
          printf ' - %s\n' "${OLD[@]}"
          rm -f "${OLD[@]}"

          git config user.name "Pomagier Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Cleanup old Pomagier workflows [skip ci]"

          if git push; then
            echo "Stare workflowy usunięte z repo."
          else
            echo "::warning::Nie udało się automatycznie usunąć starych workflowów. Build APK zakończył się normalnie. Usuń stare pliki .github/workflows ręcznie albo nadaj workflowowi prawo zapisu i uruchom go ponownie."
          fi
