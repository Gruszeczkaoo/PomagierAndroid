name: Build Pomagier Android APK

"on":
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: pomagier-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: One-time cleanup of old workflow files
        shell: bash
        continue-on-error: true
        run: |
          set -u
          KEEP=".github/workflows/build-apk.yml"
          mkdir -p .github/workflows

          mapfile -t OLD < <(
            find .github/workflows -maxdepth 1 -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              ! -path "$KEEP" -print
          )

          if [ "${#OLD[@]}" -eq 0 ]; then
            echo "Brak starych workflowow do usuniecia."
            exit 0
          fi

          echo "Usuwam stare workflowy:"
          printf ' - %s\n' "${OLD[@]}"
          rm -f "${OLD[@]}"

          git config user.name "Pomagier Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Cleanup old Pomagier workflows"

          if git push; then
            echo "Stare workflowy usuniete z repo."
          else
            echo "::warning::Nie udalo sie wypchnac sprzatania. Build bedzie kontynuowany. W Settings > Actions > General ustaw Workflow permissions na Read and write permissions i uruchom ten workflow ponownie."
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find newest Pomagier ZIP and extract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir extracted

          ZIP_FILE="$(
            find . -maxdepth 1 -type f -name 'PomagierAndroid_v*.zip' -printf '%f\n' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Nie znaleziono PomagierAndroid_v*.zip w katalogu glownym repo."
            ls -la
            exit 1
          fi

          echo "Uzywam najnowszej paczki: $ZIP_FILE"
          unzip -tq "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(
            find extracted -mindepth 1 -maxdepth 2 -type f -name 'settings.gradle.kts' -printf '%h\n' \
              | head -n 1
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Nie znaleziono projektu Android po rozpakowaniu."
            find extracted -maxdepth 3 -type f -print | head -n 100
            exit 1
          fi

          VERSION="$(
            sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
              "$PROJECT_DIR/app/build.gradle.kts" | head -n 1
          )"
          [ -n "$VERSION" ] || VERSION="unknown"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "POMAGIER_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Projekt: $PROJECT_DIR"
          echo "Wersja: $VERSION"

      - name: Validate sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          node --check app/src/main/assets/pomagier.user.js
          python -m py_compile app/src/main/python/brain.py app/src/main/python/brain_android.py
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for p in pathlib.Path("app/src/main").rglob("*.xml"):
              ET.parse(p)
          print("XML OK")
          PY

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleRelease

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          OUT="Pomagier-by-Don-v${POMAGIER_VERSION}.apk"
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pomagier-by-Don-v${{ env.POMAGIER_VERSION }}
          if-no-files-found: error
          path: |
            ${{ env.APK_FILE }}
            ${{ env.APK_FILE }}.sha256
