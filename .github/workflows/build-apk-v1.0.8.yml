name: Build Pomagier Android APK v1.0.8

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -tq "PomagierAndroid_v1.0.8_ALCOHOL_V2_MENEL_DEDUPE_FIX.zip"
          unzip -q "PomagierAndroid_v1.0.8_ALCOHOL_V2_MENEL_DEDUPE_FIX.zip" -d extracted

      - name: Validate sources
        run: |
          cd "extracted/PomagierAndroid_v1.0.8_ALCOHOL_V2_MENEL_DEDUPE_FIX"
          node --check app/src/main/assets/pomagier.user.js
          python -m py_compile app/src/main/python/brain.py app/src/main/python/brain_android.py

      - name: Build signed release APK
        run: |
          cd "extracted/PomagierAndroid_v1.0.8_ALCOHOL_V2_MENEL_DEDUPE_FIX"
          gradle --no-daemon clean assembleRelease

      - name: Prepare APK
        run: |
          cp "extracted/PomagierAndroid_v1.0.8_ALCOHOL_V2_MENEL_DEDUPE_FIX/app/build/outputs/apk/release/app-release.apk" "Pomagier-by-Don-v1.0.8.apk"
          sha256sum "Pomagier-by-Don-v1.0.8.apk" > "Pomagier-by-Don-v1.0.8.apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pomagier-by-Don-v1.0.8
          if-no-files-found: error
          path: |
            Pomagier-by-Don-v1.0.8.apk
            Pomagier-by-Don-v1.0.8.apk.sha256
